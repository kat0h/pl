plugins {
  id 'java'
  id 'application'
  id 'antlr'
}

repositories {
  mavenCentral()
}

application {
  mainClass = 'easyscript.Main'
}

run {
  standardInput = System.in
}

ext {
  graal_version = '23.1.11'
  antlr_version = '4.12.0'
}

test {
  useJUnitPlatform()
  // jvmArgs '-ea',
  //         '--add-exports',
  //             'org.graalvm.truffle/com.oracle.truffle.api=ALL-UNNAMED',
  //         '--add-exports',
  //             'org.graalvm.truffle/com.oracle.truffle.api.nodes=ALL-UNNAMED',
  //         '--add-exports',
  //             'org.graalvm.truffle/com.oracle.truffle.api.staticobject=ALL-UNNAMED'
  testLogging {
    events 'failed'
    exceptionFormat = 'full'
  }
}

dependencies {
  implementation "org.graalvm.truffle:truffle-api:$graal_version"
  annotationProcessor "org.graalvm.truffle:truffle-dsl-processor:$graal_version"
  testImplementation "org.junit.jupiter:junit-jupiter:5.9.3"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher" // 今のバージョンはこれが必要らしい？
  antlr "org.antlr:antlr4:4.12.0"
  implementation "org.graalvm.polyglot:polyglot:$graal_version"
  implementation "org.graalvm.polyglot:js:$graal_version" // PolyglotTest.javaでjavascriptを使用している
}
